# =============================================================================
# QAGRedo offline — runner + host Ollama (default)
# =============================================================================
#
# Ollama must be running on the Docker host (same machine), typically on port
# 11434. The qagredo container reaches it via host.docker.internal (Linux:
# extra_hosts host-gateway).
#
# Legacy vLLM stack (two GPU services): see docker-compose.vllm-stack.yml.
#
# Usual command:  bash run.sh
# =============================================================================

name: qagredo_offline

services:
  qagredo:
    build:
      context: .
      dockerfile: Dockerfile
    image: qagredo-v1:latest
    container_name: qagredo-runner
    privileged: true
    userns_mode: host
    # Host network mode: container shares the host's loopback so
    # localhost:11434 inside the container reaches Ollama on the host
    # without needing host.docker.internal or Ollama to bind 0.0.0.0.
    # This is the no-sudo path — works even when systemd Ollama listens
    # only on 127.0.0.1.
    network_mode: host
    # All LLM provider / model / URL / API-key settings live in
    # config/config.dev.yaml — NOT here. This block only exposes
    # container-runtime essentials (user mapping, offline flags, data paths).
    environment:
      TZ: ${TZ:-Asia/Singapore}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      OFFLINE_MODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYDANTIC_DISABLE_PLUGIN_LOADING: "1"
      QAGREDO_OFFLINE_HOST: ${QAGREDO_OFFLINE_HOST:-}
      QAGREDO_OFFLINE_INPUT: ${QAGREDO_OFFLINE_INPUT:-}
    volumes:
      - ./run_qa_pipeline.py:/workspace/run_qa_pipeline.py:rw
      - ./utils:/workspace/utils:rw
      - ./scripts:/workspace/scripts:rw
      - ./config:/workspace/config:rw
      - ${DATA_DIR:-./data}:/workspace/data:rw
      - ./output:/workspace/output:rw
      - ./hf_cache:/opt/hf_cache:rw
      - ./models_embed:/opt/models_embed:rw
      - ./README.md:/workspace/README.md:rw
      - ./OFFLINE_GUIDE.md:/workspace/OFFLINE_GUIDE.md:rw
      - ./docs:/workspace/docs:rw
    command:
      - bash
      - -c
      - |
        unset TRANSFORMERS_CACHE
        echo "[INFO] Dev profile — config/config.dev.yaml"
        python /workspace/run_qa_pipeline.py
