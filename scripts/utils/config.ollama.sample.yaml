# Sample QAGRedo config for Ollama. For normal runs, prefer
# config/config.dev.yaml or config/config.kubeflow.yaml and select the profile
# with QAGREDO_PROFILE in .env.

offline_mode: true

framework:
  use_langchain: true
  use_langgraph: true
  langchain:
    structured_json_output: true
  langgraph:
    enable_dynamic_routing: true
    semantic_fallback_threshold: 0.7

run:
  input_folder: "txt"
  input_file: ""
  input_glob: "*.txt"
  auto_convert: false
  output_folder: timestamp
  output_analysis_stem: document_id
  input_type: auto
  max_files: 0
  num_documents: 2
  save_grounded_qa_pairs_only: false
  minimal_qa_output: false
  min_content_words: 20
  min_content_chars: 0
  semantic_normalization:
    enable: false
    max_content_chars: 5000

llm:
  provider: "ollama"
  # Offline Ollama: pull this tag AND judge.model (e.g. qwen3.5:9b + llama3.1:8b-instruct-fp16).
  model: "qwen3.5:9b"
  temperature: 0.7
  max_tokens: 500
  max_retries: 3
  retry_delay: 1.0
  api_key: "ollama-local"
  base_url: "http://localhost:11434/v1"
  timeout: 60

answer_generation:
  temperature: 0.3
  multi_turn:
    enable_rejection: true
    min_confidence_threshold: 0.7
    max_answer_attempts: 3
    max_regeneration_attempts: 2
    max_question_regeneration_rounds: 3
  coverage_validation:
    enable: true
    min_score_threshold: 0.7
    max_doc_chars: 5000

question_generation:
  num_questions: 3
  complexity: "advanced"
  deduplication_method: "llm"
  dedup_llm:
    use_judge_model: true
    strict: true
    max_tokens: 80
  validation:
    enable_rejection: true
    method: "llm"
    min_confidence_threshold: 0.7
    max_regeneration_attempts: 2
    enable_comprehensiveness_check: true
    comprehensiveness_min_score: 0.6
    comprehensiveness_max_attempts: 2

judge:
  provider: "ollama"
  model: "llama3.1:8b-instruct-fp16"
  base_url: "http://localhost:11434/v1"
  api_key: "ollama-local"
  temperature: 0.0
  max_tokens: 200
  timeout: 60
  max_retries: 3
  retry_delay: 1.0

hallucination:
  method: "llm"
  judge_required: true
  judge_strict_verdict: true
  allow_semantic_fallback: false
  citation_alignment: "off"
  grounding_explanation_when_no_citations: "off"
