# Optional generator override for Qwen/Qwen3-14B-FP8 on one 24GB GPU.
#
# Enable in .env:
#   VLLM_MODEL=/models/Qwen3-14B-FP8
#   VLLM_SERVED_MODEL_NAME=Qwen/Qwen3-14B-FP8
#   QAG_VLLM_COMPOSE_EXTRA=docker-compose.vllm-qwen3-14b-gen.yml
#
# Note: there is no Qwen/Qwen3.5-14B on Hugging Face. Qwen3.5 sizes include
# 9B, 4B, 27B, 35B-A3B, etc. This overlay uses the Qwen3 14B FP8 checkpoint.
#
# Download weights first:
#   bash scripts/download_vllm_generator_qwen3_14b_fp8.sh

services:
  vllm:
    command:
      - --host
      - 0.0.0.0
      - --port
      - "7100"
      - --model
      - ${VLLM_MODEL:-/models/Qwen3-14B-FP8}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-Qwen/Qwen3-14B-FP8}
      - --tokenizer-mode
      - ${VLLM_TOKENIZER_MODE:-slow}
      - --tensor-parallel-size
      - "${VLLM_TP_SIZE:-1}"
      - --dtype
      - auto
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${VLLM_GPU_UTIL:-0.90}
      - --api-key
      - ${VLLM_API_KEY:-llama-local}
      - --trust-remote-code
      - --enforce-eager
