# Optional LoRA overlay for generator eval runs.
#
# Enable in shell before vLLM start:
#   export QAG_VLLM_COMPOSE_EXTRA=docker-compose.vllm-lora.yml
#   export VLLM_LORA_MODULES=qag-sft=/models/Qwen3.5-9B-qag-lora
#   bash run.sh --vllm-up generator
#
# Then point config llm.model at the module name (qag-sft or qag-dpo).

services:
  vllm:
    command:
      - --host
      - 0.0.0.0
      - --port
      - "7100"
      - --model
      - ${VLLM_MODEL:-/models/Qwen3.5-9B}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-Qwen/Qwen3.5-9B}
      - --tokenizer-mode
      - ${VLLM_TOKENIZER_MODE:-auto}
      - --tensor-parallel-size
      - "${VLLM_TP_SIZE:-1}"
      - --dtype
      - half
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${VLLM_GPU_UTIL:-0.90}
      - --api-key
      - ${VLLM_API_KEY:-llama-local}
      - --trust-remote-code
      - --language-model-only
      - --enforce-eager
      - --enable-lora
      - --max-lora-rank
      - "${VLLM_MAX_LORA_RANK:-64}"
      - --lora-modules
      - ${VLLM_LORA_MODULES:-qag-sft=/models/Qwen3.5-9B-qag-lora}
