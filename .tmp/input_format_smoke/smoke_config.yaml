offline_mode: true
framework:
  use_langchain: true
  use_langgraph: true
  langchain:
    structured_json_output: true
  langgraph:
    enable_dynamic_routing: true
    semantic_fallback_threshold: 0.7
run:
  input_folder: ''
  input_file: ''
  input_type: auto
  max_files: null
  num_documents: 0
  min_content_words: 20
  min_content_chars: 0
  semantic_normalization:
    enable: false
    max_content_chars: 5000
llm:
  provider: vllm
  model: meta-llama/Meta-Llama-3.1-8B-Instruct
  temperature: 0.7
  max_tokens: 500
  max_retries: 3
  retry_delay: 1.0
  api_key: llama-local
  base_url: http://localhost:7100/v1
  timeout: 60
answer_generation:
  temperature: 0.3
  coverage_validation:
    enable: true
    min_score_threshold: 0.7
    max_doc_chars: 5000
question_generation:
  num_questions: 3
  complexity: advanced
  validation:
    enable_rejection: true
    min_confidence_threshold: 0.7
    max_regeneration_attempts: 2
    enable_comprehensiveness_check: true
    comprehensiveness_min_score: 0.6
    comprehensiveness_max_attempts: 2
judge:
  provider: vllm
  model: Qwen/Qwen2.5-7B-Instruct
  base_url: http://localhost:7101/v1
  api_key: qwen-local
  temperature: 0.0
  max_tokens: 200
  timeout: 60
  max_retries: 3
  retry_delay: 1.0
hallucination:
  method: hybrid
