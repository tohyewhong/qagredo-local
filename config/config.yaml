# ============================================================================
#  config/config.yaml — LEGACY DEFAULT (mirrors config/config.ollama.yaml)
# ============================================================================
#
#  `bash run.sh` picks the profile YAML automatically based on the value
#  of  QAGREDO_PROFILE  in .env:
#       ollama    → config/config.ollama.yaml
#       dev       → (alias) config/config.ollama.yaml
#       kubeflow  → config/config.kubeflow.yaml
#       vllm      → config/config.vllm.yaml
#
#  This file exists only so that the legacy command
#       python run_qa_pipeline.py             (no --config flag)
#  still works. EDIT THE PROFILE YAML ABOVE, NOT THIS ONE.
# ============================================================================

offline_mode: true

framework:
  use_langchain: true
  use_langgraph: true
  langchain:
    structured_json_output: true
  langgraph:
    enable_dynamic_routing: true
    semantic_fallback_threshold: 0.7

# -------------------------------------------------------------------------
# INPUT / OUTPUT — folder is usually set via .env (QAGREDO_OFFLINE_*).
# -------------------------------------------------------------------------
run:
  input_folder: "."
  input_file: ""
  input_glob: "*.txt"
  auto_convert: false
  output_folder: timestamp
  output_analysis_stem: document_id
  input_type: auto
  max_files: 0
  num_documents: 10            # CHANGE ME — how many documents to process
  save_grounded_qa_pairs_only: false
  reject_insufficient_answers: true
  minimal_qa_output: false
  min_content_words: 250
  min_content_chars: 0
  semantic_normalization:
    enable: false
    max_content_chars: 5000

# -------------------------------------------------------------------------
# GENERATOR — writes questions and answers.
# Ollama serves both generator and judge on the same port (11434).
# -------------------------------------------------------------------------
llm:
  provider: "ollama"
  model: "qwen3.5:9b"           # CHANGE ME — Ollama tag for the GENERATOR
  base_url: "http://localhost:11434/v1"
  api_key: "EMPTY"              # Ollama ignores this; leave as-is.
  temperature: 0.7
  max_tokens: 500
  max_retries: 3
  retry_delay: 1.0
  timeout: 240                  # seconds; high enough to absorb cold-load

answer_generation:
  temperature: 0.3
  multi_turn:
    enable_rejection: true
    min_confidence_threshold: 0.7
    max_answer_attempts: 3
    max_regeneration_attempts: 2
    max_question_regeneration_rounds: 3
  coverage_validation:
    enable: true
    min_score_threshold: 0.7
    max_doc_chars: 5000

question_generation:
  num_questions: 3              # CHANGE ME — how many questions per document
  complexity: "advanced"        # basic | moderate | advanced
  deduplication_method: "llm"
  dedup_llm:
    use_judge_model: true
    strict: true
    max_tokens: 80
  validation:
    enable_rejection: true
    method: "llm"
    min_confidence_threshold: 0.7
    max_regeneration_attempts: 2
    enable_comprehensiveness_check: true
    comprehensiveness_min_score: 0.6
    comprehensiveness_max_attempts: 2
    comprehensiveness_strict: true

# -------------------------------------------------------------------------
# JUDGE — second model that double-checks answers for hallucination.
# Keep it DIFFERENT from the generator to avoid self-grading bias.
# -------------------------------------------------------------------------
judge:
  provider: "ollama"
  model: "llama3.1:8b-instruct-fp16"   # CHANGE ME — Ollama tag for the JUDGE
  base_url: "http://localhost:11434/v1"
  api_key: "EMPTY"
  temperature: 0.0
  max_tokens: 200
  timeout: 240
  max_retries: 3
  retry_delay: 1.0

hallucination:
  method: "llm"
  judge_required: true
  judge_strict_verdict: true
  allow_semantic_fallback: false
  citation_alignment: "off"
  grounding_explanation_when_no_citations: "off"
