# ============================================================================
#  QAGRedo — DEV profile  (Ollama running on this machine)
# ============================================================================
#
#  WHEN IS THIS FILE USED?
#    Whenever .env has  QAGREDO_PROFILE=dev  (and you run `bash run.sh`).
#
#  LAYMAN CHEAT SHEET — the only 4 things you will ever want to change:
#
#    1) run.num_documents              → how many documents to process
#    2) question_generation.num_questions → how many questions per document
#    3) llm.model                      → the Ollama tag for the generator
#    4) judge.model                    → the Ollama tag for the judge
#
#  Each of those is marked "CHANGE ME" further down.
#
#  Prerequisite: the tags in (3) and (4) must appear in  `ollama list`  on
#  this machine. If not, run for example:  ollama pull qwen3.5:9b
#
#  SWITCH NOTE:
#    If you are coming from vLLM and want Ollama, set in .env:
#      QAGREDO_PROFILE=dev
#    then change ONLY llm.model and judge.model below.
#
#  Everything else in this file: LEAVE ALONE unless something tells you
#  otherwise.
# ============================================================================

offline_mode: true

framework:
  use_langchain: true
  use_langgraph: true
  langchain:
    structured_json_output: true
  langgraph:
    enable_dynamic_routing: true
    semantic_fallback_threshold: 0.7

# -------------------------------------------------------------------------
# INPUT / OUTPUT — folder is usually set via .env (QAGREDO_OFFLINE_*).
# -------------------------------------------------------------------------
run:
  input_folder: "txt"
  input_file: ""
  input_glob: "*.txt"
  auto_convert: false
  output_folder: timestamp
  output_analysis_stem: document_id
  input_type: auto
  max_files: 0
  num_documents: 10            # CHANGE ME — how many documents to process
  save_grounded_qa_pairs_only: false
  minimal_qa_output: false
  min_content_words: 20
  min_content_chars: 0
  semantic_normalization:
    enable: false
    max_content_chars: 5000

# -------------------------------------------------------------------------
# GENERATOR — writes questions and answers.
# Ollama serves both generator and judge on the same port (11434).
# -------------------------------------------------------------------------
llm:
  provider: "ollama"
  model: "qwen3.5:9b"           # CHANGE ME — Ollama tag for the GENERATOR
  base_url: "http://localhost:11434/v1"
  api_key: "EMPTY"              # Ollama ignores this; leave as-is.
  temperature: 0.7
  max_tokens: 500
  max_retries: 3
  retry_delay: 1.0
  timeout: 240                  # seconds; high enough to absorb cold-load

answer_generation:
  temperature: 0.3
  multi_turn:
    enable_rejection: true
    min_confidence_threshold: 0.7
    max_answer_attempts: 3
    max_regeneration_attempts: 2
    max_question_regeneration_rounds: 3
  coverage_validation:
    enable: true
    min_score_threshold: 0.7
    max_doc_chars: 5000

question_generation:
  num_questions: 3              # CHANGE ME — how many questions per document
  complexity: "advanced"        # basic | moderate | advanced
  deduplication_method: "llm"
  dedup_llm:
    use_judge_model: true
    strict: true
    max_tokens: 80
  validation:
    enable_rejection: true
    method: "llm"
    min_confidence_threshold: 0.7
    max_regeneration_attempts: 2
    enable_comprehensiveness_check: true
    comprehensiveness_min_score: 0.6
    comprehensiveness_max_attempts: 2

# -------------------------------------------------------------------------
# JUDGE — second model that double-checks answers for hallucination.
# Keep it DIFFERENT from the generator to avoid self-grading bias.
# -------------------------------------------------------------------------
judge:
  provider: "ollama"
  model: "llama3.1:8b-instruct-fp16"   # CHANGE ME — Ollama tag for the JUDGE
  base_url: "http://localhost:11434/v1"
  api_key: "EMPTY"
  temperature: 0.0
  max_tokens: 200
  timeout: 240
  max_retries: 3
  retry_delay: 1.0

hallucination:
  method: "llm"
  judge_required: true
  judge_strict_verdict: true
  allow_semantic_fallback: false
  citation_alignment: "off"
  grounding_explanation_when_no_citations: "off"
